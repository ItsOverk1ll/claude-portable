name: test-install-uninstall

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot profile before
        shell: pwsh
        run: ci/snapshot.ps1

      # Run the .bat launchers exactly as a user would; piped input satisfies `pause`.
      - name: Install
        shell: cmd
        run: echo.| install-claude.bat

      - name: Verify install
        shell: pwsh
        run: |
          $exe = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          if (-not (Test-Path $exe)) { throw "claude.exe missing at $exe" }
          & $exe --version

      - name: Uninstall
        shell: cmd
        run: echo.| uninstall-claude.bat

      - name: Verify no leftovers
        shell: pwsh
        run: ci/check-leftovers.ps1

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installer
        shell: pwsh
        run: |
          $mk = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $mk) { $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $mk)) {
            choco install nsis -y --no-progress
            $mk = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0' }
          & $mk /V2 "/DVERSION=$v" installer.nsi
          if ($LASTEXITCODE) { throw "makensis failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ClaudePortableSetup.exe

  exe:
    needs: build-exe
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer

      - name: Snapshot profile before
        shell: pwsh
        run: ci/snapshot.ps1

      - name: Install (silent)
        shell: pwsh
        run: |
          $p = Start-Process .\ClaudePortableSetup.exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          Get-Content "$env:TEMP\claude-portable-install.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode) { exit 1 }

      - name: Verify install
        shell: pwsh
        run: |
          $exe = Join-Path $env:USERPROFILE '.local\bin\claude.exe'
          if (-not (Test-Path $exe)) { throw "claude.exe missing at $exe" }
          & $exe --version
          # PE machine type 0x8664 = x64; proves the 32-bit installer reached 64-bit PowerShell.
          $b = [IO.File]::ReadAllBytes($exe)
          $machine = [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          if ($machine -ne 0x8664) { throw ("claude.exe is not x64 (machine 0x{0:X})" -f $machine) }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ClaudePortable'
          Get-ItemProperty $key | Format-List DisplayName, DisplayVersion, UninstallString
          if (-not (Test-Path "$env:LOCALAPPDATA\ClaudePortable\Uninstall.exe")) { throw "Uninstall.exe missing" }

      - name: Uninstall (silent, via registered uninstaller)
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ClaudePortable'
          $cmd = (Get-ItemProperty $key).UninstallString.Trim('"')
          Start-Process $cmd -ArgumentList '/S'
          # The NSIS uninstaller re-launches itself from Temp, so wait for its effects instead.
          $deadline = (Get-Date).AddMinutes(3)
          while (((Test-Path $key) -or (Test-Path "$env:LOCALAPPDATA\ClaudePortable")) -and (Get-Date) -lt $deadline) {
            Start-Sleep 2
          }
          if (Test-Path "$env:LOCALAPPDATA\ClaudePortable") { throw "Install folder still present after 3 minutes" }

      - name: Verify no leftovers
        shell: pwsh
        run: |
          Remove-Item ClaudePortableSetup.exe  # downloaded artifact, not an install leftover
          ci/check-leftovers.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [scripts, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ClaudePortableSetup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Claude Code Portable $GITHUB_REF_NAME" \
            --notes "Per-user installer for Claude Code (no admin). Run ClaudePortableSetup.exe; uninstall via 'Claude Code (portable)' in Apps & features. Unsigned: Windows SmartScreen will warn (More info -> Run anyway)."
